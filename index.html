   <path d="M170 160 C160 190 150 225 175 235 C200 245 215 210 205 185 C198 170 185 165 170 160Z" fill="none" stroke="#E07A1F" stroke-width="4" data-rota="aeroporto"/>
   <path d="M170 160 C200 130 225 70 255 55 C285 45 305 85 290 105 C270 130 220 150 170 160Z" fill="none" stroke="#7B4FB3" stroke-width="4" data-rota="bocaina"/>
   <path d="M170 160 C220 165 290 150 325 170 C350 190 335 245 300 250 C255 255 215 205 170 160Z" fill="none" stroke="#C2412D" stroke-width="4" data-rota="farias"/>`;
  const verRotas = filtro==='todos'||filtro==='rotas';
  let pins='';
  Object.entries(LUGARES).forEach(([id,l])=>{
    const tipoOk = filtro==='todos' || (filtro==='restaurantes'&&l.tipo==='restaurante') || (filtro==='locais'&&l.tipo==='local') || (filtro==='aberto'&&l.aberto);
    if(!tipoOk) return;
    const c = l.tipo==='restaurante' ? '#E9B10F' : '#1E4D3A';

      <circle r="13" fill="${c}" stroke="#fff" stroke-width="2.5"/>
      <text text-anchor="middle" y="5" font-size="13">${l.tipo==='restaurante'?'🍴':'★'}</text>
      ${interativo?`<text text-anchor="middle" y="27" font-size="9.5" font-weight="700" fill="#1B1F1D" stroke="#fff" stroke-width="3" paint-order="stroke">${l.nome.split(' ').slice(0,3).join(' ')}</text>`:''}</g>`;
  });
  return `<svg viewBox="0 0 360 280" role="img" aria-label="Mapa ilustrativo de Lavras com rotas e lugares">
    <rect width="360" height="280" fill="#E8EFDF"/>
    <path d="M0 210 C60 200 90 240 140 255 C190 270 240 262 360 268 L360 280 L0 280Z" fill="#CFE3EE"/>
    <path d="M20 40 C80 20 120 50 150 30" stroke="#D5DEC8" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M0 150 L360 150" stroke="#fff" stroke-width="5"/><path d="M180 0 L180 280" stroke="#fff" stroke-width="5"/>
    <path d="M40 0 C120 120 240 120 340 280" fill="none" stroke="#fff" stroke-width="3" opacity=".8"/>
    <circle cx="185" cy="148" r="32" fill="#DCD8CC" opacity=".8"/>
    <text x="214" y="186" font-size="10" fill="#6E746F" font-weight="700">CENTRO</text>
    <text x="62" y="228" font-size="9.5" fill="#5C8BA6" font-style="italic">Lago do Funil</text>
    ${verRotas?rotas:''}
    <g transform="translate(170 160)"><circle r="7" fill="#fff" stroke="#1B1F1D" stroke-width="2.5"/></g>
    ${pins}
  </svg>`;
}

 },
};

/* ===================== COMPONENTES ===================== */
function voltarBtn(){return `<button class="icon-btn" onclick="voltar()" aria-label="Voltar">←</button>`}
function badge(l){return l.aberto?'<span class="badge b-aberto">Aberto agora</span>':'<span class="badge b-fechado">Fechado</span>'}
function vazio(t,i='🔎'){return `<div class="vazio"><span class="i">${i}</span>${t}</div>`}
function cardLugar(id,l){return `<button class="card item card-btn" onclick="ir('lugar',{id:'${id}'})">
  <div class="thumb" style="background:${l.cor}">${l.icone}</div>
  <div class="txt"><h3>${l.nome}</h3><div class="meta">${l.categoria}<br>${badge(l)} · ${l.preco} · ${l.distancia}</div></div>
  <span class="chev">›</span></button>`}
function favoritar(id){
  if(estado.favoritos.has(id)){estado.favoritos.delete(id);toast('Removido dos salvos.')}
  else{estado.favoritos.add(id);toast('Salvo! Veja em Salvos, na barra de baixo.')}
  render();
}
function avisar(id){
  if(estado.avisos.has(id)){estado.avisos.delete(id);toast('Aviso cancelado.')}
  else{estado.avisos.add(id);toast('Pronto! Vamos te avisar 1 dia antes e no dia do evento.')}
  render();
}
function toggleCat(k){
  const nome=CATEGORIAS.find(c=>c[0]===k)[2];
  if(estado.catAvisos.has(k)){estado.catAvisos.delete(k);toast('Avisos de '+nome+' desativados.')}
  else{estado.catAvisos.add(k);toast('Pronto! Você será avisado sobre eventos de '+nome+'.')}
  render();
}
function abrirMenu(){
  const d=$('#drawer'),b=$('#drawerBg');
  d.innerHTML=`<div class="user"><div class="avatar">U1</div><div><b>Usuário 1</b><div class="meta">Conta de teste</div></div></div>
   <button onclick="fecharMenu();aba('inicio')">🏠 Início</button>
   <button onclick="fecharMenu();ir('restaurantes')">🍴 Restaurantes</button>
   <button onclick="fecharMenu();ir('eventos')">📅 Eventos</button>
   <button onclick="fecharMenu();ir('locais')">📍 Locais</button>
   <button onclick="fecharMenu();ir('rotas')">🚴 Rotas de bike</button>
   <button onclick="fecharMenu();aba('favoritos')">♥ Salvos</button>
   <button onclick="fecharMenu();ir('avisos')">🔔 Avisos de eventos</button>
   <button onclick="fecharMenu();window.open('https://lvrs.com.br','_blank','noopener')">ℹ️ Sobre o Vale dos Ipês ↗</button>`;
  d.classList.add('open');b.classList.add('open');b.onclick=fecharMenu;
}
function fecharMenu(){$('#drawer').classList.remove('open');$('#drawerBg').classList.remove('open')}

function render(){
  const atual=estado.pilha[estado.pilha.length-1];
  if(atual.tela!=='mapa') estado.sel=null;
  const t=TELAS[atual.tela](atual);
  $('#topbar').innerHTML=t.top;$('#content').innerHTML=t.html;
  const raiz=estado.pilha[0].tela;
  $('#tabbar').innerHTML=[['inicio','🏠','Início'],['mapa','🗺️','Mapa'],['favoritos','♥','Salvos'],['perfil','👤','Perfil']]
    .map(([k,i,n])=>`<button class="${raiz===k?'on':''}" onclick="aba('${k}')"><span class="i">${i}</span>${n}${k==='favoritos'&&(estado.favoritos.size+estado.avisos.size)?` (${estado.favoritos.size+estado.avisos.size})`:''}</button>`).join('');
  if(t.after)t.after();
}
render();
</script>
</body>
